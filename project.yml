name: Kininaru
fileGroups:
  - Kininaru/Spike/Resources
options:
  bundleIdPrefix: com.marufeuille
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: ja
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "2"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    CODE_SIGN_STYLE: Automatic
    SUPPORTS_MACCATALYST: NO
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
    SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
configs:
  Debug: debug
  Release: release
targets:
  Kininaru:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Kininaru
        excludes:
          - "Spike/Resources/**"
    postBuildScripts:
      - name: Debug の計測リソース
        basedOnDependencyAnalysis: false
        script: bash "${SRCROOT}/scripts/copy-spike-resources.sh"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.marufeuille.kininaru
        PRODUCT_NAME: Kininaru
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "きになる"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: "NO"
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
          INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "計測画面で、端末の中だけで音声認識できるかを調べます。音声はサーバに送りません。"
          INFOPLIST_KEY_NSMicrophoneUsageDescription: "計測画面で、マイクの音声を端末の中だけで認識できるかを調べます。質問画面では使いません。"
        Release:
          # フォルダ名だけだと中のファイルが残ることがあるので、段ごとに外す。
          EXCLUDED_SOURCE_FILE_NAMES: "$(SRCROOT)/Kininaru/Spike $(SRCROOT)/Kininaru/Spike/* $(SRCROOT)/Kininaru/Spike/*/* $(SRCROOT)/Kininaru/Spike/*/*/*"
  KininaruTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: KininaruTests
    dependencies:
      - target: Kininaru
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.marufeuille.kininaru.tests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "2"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Kininaru.app/Kininaru"
        BUNDLE_LOADER: "$(TEST_HOST)"
  KininaruUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: KininaruUITests
    dependencies:
      - target: Kininaru
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.marufeuille.kininaru.uitests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "2"
        TEST_TARGET_NAME: Kininaru
schemes:
  Kininaru:
    build:
      targets:
        Kininaru: all
        KininaruTests: [test]
        KininaruUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - KininaruTests
        - KininaruUITests
    archive:
      config: Release
